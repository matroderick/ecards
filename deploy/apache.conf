# ecards on Apache. Replace cards.example.com with your base domain, then:
#   a2enmod ssl headers rewrite cgid proxy proxy_http vhost_alias
#   cp deploy/apache.conf /etc/apache2/sites-available/cards.example.com.conf && a2ensite cards.example.com
# Needs a wildcard certificate for cards.example.com and *.cards.example.com (DNS-01), see docs/DEPLOY.md.
#   cards.example.com        landing page
#   app.cards.example.com    the Python app (127.0.0.1:8780)
#   *.cards.example.com      one static folder per user in /var/www/far-users/<handle>
# Order matters: exact ServerNames first, wildcard last.

<VirtualHost *:80>
    ServerName cards.example.com
    ServerAlias www.cards.example.com app.cards.example.com *.cards.example.com
    RewriteEngine on
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName cards.example.com
    ServerAlias www.cards.example.com
    DocumentRoot /var/www/cards.example.com
    <Directory /var/www/cards.example.com>
        Options -Indexes
        Require all granted
    </Directory>
    # CGIs read their configuration from the environment: keep these in step with /etc/far-app.env
    SetEnv FAR_BASE_DOMAIN cards.example.com
    ScriptAlias /api/ /usr/local/lib/far-cgi/
    <Directory /usr/local/lib/far-cgi>
        Require all granted
    </Directory>
    RewriteEngine on
    RewriteCond %{HTTP_HOST} ^www\. [NC]
    RewriteRule ^ https://cards.example.com%{REQUEST_URI} [R=301,L]
    SSLEngine on
    SSLCertificateFile /etc/ssl/cards.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/ssl/cards.example.com/privkey.pem
</VirtualHost>

<VirtualHost *:443>
    ServerName app.cards.example.com
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8780/ timeout=60
    ProxyPassReverse / http://127.0.0.1:8780/
    LimitRequestBody 12582912
    Header always set Strict-Transport-Security "max-age=31536000"
    SSLEngine on
    SSLCertificateFile /etc/ssl/cards.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/ssl/cards.example.com/privkey.pem
</VirtualHost>

<VirtualHost *:443>
    ServerName wildcard.cards.example.com
    ServerAlias *.cards.example.com
    UseCanonicalName Off
    VirtualDocumentRoot /var/www/far-users/%1
    <Directory /var/www/far-users>
        Options -Indexes +SymLinksIfOwnerMatch
        Require all granted
    </Directory>
    AddType "text/vcard; charset=utf-8" .vcf
    Header always set X-Robots-Tag "noindex"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Strict-Transport-Security "max-age=31536000"
    <Files "loc.json">
        Header set Cache-Control "no-store"
    </Files>
    SetEnv FAR_BASE_DOMAIN cards.example.com
    ScriptAlias /api/ /usr/local/lib/far-cgi/
    <Directory /usr/local/lib/far-cgi>
        Require all granted
    </Directory>
    SSLEngine on
    SSLCertificateFile /etc/ssl/cards.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/ssl/cards.example.com/privkey.pem
</VirtualHost>
